# Autonomous RAG System Configuration

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dimension: 384

retrieval:
  top_k: 5
  faiss_hybrid_weight: 0.6  # Weight for semantic search vs BM25
  bm25_weight: 0.4
  max_retrieve_attempts: 2
  tool_top_k: 5

tools:
  sql:
    enabled: true
    database_path: "data/metadata/sample_knowledge.db"
    tables: ["policies", "api_docs"]
    trust_score: 0.85
    max_rows: 5
  rest:
    enabled: false
    endpoints: []

trust_scoring:
  default_trust: 0.5
  trusted_domains: []
  manual_overrides: {}
  decay_half_life_days: 180
  manual_trust_weights:
    domain_reputation: 0.3
    historical_accuracy: 0.25
    citation_frequency: 0.2
    manual_seed: 0.25

llm:
  generator_model: "gpt-4o-mini"
  verifier_model: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 1024

vector_store:
  path: "data/processed/faiss_index"
  version_prefix: "v"

decay_model:
  half_life_days: 180
  min_decay_factor: 0.1

evaluation:
  hallucination_threshold: 0.3
  baseline_comparison: true
